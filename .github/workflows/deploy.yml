name: Deploy

on:
  push:
    branches: ['develop', 'master']
  pull_request:
    branches: ['develop', 'master']

jobs:
  cancel-previous:
    name: 'Cancel Previous Runs'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: styfle/cancel-workflow-action@b173b6ec0100793626c2d9e6b90435061f4fc3e5 # 0.11.0
        with:
          access_token: ${{ github.token }}

  deploy:
    runs-on: ubuntu-latest
    needs: cancel-previous
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
          # The push token is only needed to push release commits and tags.
          token: ${{ github.event_name == 'push' && secrets.GH_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@27082cecf3ff7a1742dbd5e12605f0cb59dce2d9 # v2.1.3
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/

      - name: Set npm credentials
        if: github.event_name == 'push'
        run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - name: Install package
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Eslint validation
        run: npm run lint

      - name: Npm Run Test
        run: npm run test

      - name: Publish ${{ github.ref }}
        if: github.event_name == 'push'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  sync_development_with_master:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: deploy
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.GH_PUSH_TOKEN }}
      - name: Merge master into develop branch
        run: |
          git merge origin/master
          git push origin develop
